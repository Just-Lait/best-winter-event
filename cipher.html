<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шифры</title>

<style>
  @font-face {
    font-family: 'Undertale';
    src: url('fonts/Undertale.ttf') format('truetype');
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Undertale', 'Courier New', monospace;
    background: radial-gradient(ellipse at 50% -20%, #0a0f1e 0%, #05070f 50%, #000 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    letter-spacing: 0.5px;
  }

  .panel {
    width: 100%;
    max-width: 1200px;
    border: 2px solid #fff;
    padding: 52px 48px;
    background: rgba(255, 255, 255, 0.02);
  }

  h1 {
    font-size: 26px;
    font-weight: normal;
    margin-bottom: 8px;
    text-align: center;
  }

  .sub {
    text-align: center;
    color: #b8c2d6;
    font-size: 13px;
    margin-bottom: 32px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 28px;
    margin-bottom: 32px;
  }

  .cipher-card {
    display: block;
    text-decoration: none;
    color: #fff;
    border: 2px solid #fff;
    padding: 40px 28px;
    text-align: center;
    background: rgba(255, 255, 255, 0.02);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .cipher-card:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-4px);
  }

  .cipher-card img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    margin-bottom: 24px;
    image-rendering: pixelated;
  }

  .cipher-card .name {
    font-size: 24px;
    margin-bottom: 8px;
  }

  .cipher-card .desc {
    font-size: 15px;
    color: #b8c2d6;
  }

  .cipher-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  .back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #b8c2d6;
    text-decoration: none;
    font-size: 13px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 20px;
    transition: color 0.15s;
  }

  .back:hover { color: #fff; }
</style>
</head>
<body>

<div class="panel">
  <h1>Шифры</h1>
  <p class="sub">Выберите шифр для работы</p>

  <div class="grid">
    <a href="caesar.html" class="cipher-card">
      <img src="images/caesar.png" alt="Цезарь">
      <div class="name">Шифр Цезаря</div>
      <div class="desc">Сдвиг алфавита</div>
    </a>

    <a href="vigenere.html" class="cipher-card">
      <img src="images/Vizhiner.png" alt="Виженер">
      <div class="name">Шифр Виженера</div>
      <div class="desc">Шифр с ключевым словом</div>
    </a>

    <a href="wingdings.html" class="cipher-card">
      <img src="images/GASTER.png" alt="GASTER">
      <div class="name">Windings</div>
      <div class="desc">???</div>
    </a>
  </div>

  <a href="index.html" class="back">← Вернуться на главную</a>
</div>

</body>
</html>
